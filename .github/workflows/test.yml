name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14   # Apple silicon
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install (test mode; builds the app, the helpers and .venv like a user's install)
        run: SEMSEARCH_APP="$RUNNER_TEMP/SemSearch.app" SEMSEARCH_SKIP_AGENT=1 ./install.sh
      - name: Check the built app
        run: |
          test -x "$RUNNER_TEMP/SemSearch.app/Contents/MacOS/SemSearch"
          test -x bin/semsearch-ocr && test -x bin/semsearch-fswatch
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/SemSearch.app/Contents/Info.plist")" = "$(cat VERSION)"
      - name: Install without the Command Line Tools, from prebuilt programs (as from the Homebrew bottle)
        run: |
          mac/build.sh prebuilt && cp VERSION prebuilt/
          nocl="$RUNNER_TEMP/nocl" && mkdir -p "$nocl"
          printf '#!/bin/sh\nexit 2\n' > "$nocl/xcode-select"
          printf '#!/bin/sh\necho "$0 must not run" >&2; exit 99\n' > "$nocl/swiftc"
          cp "$nocl/swiftc" "$nocl/xcrun" && chmod +x "$nocl"/*
          PATH="$nocl:$PATH" SEMSEARCH_APP="$RUNNER_TEMP/SemSearch.app" SEMSEARCH_SKIP_AGENT=1 ./install.sh
          cmp prebuilt/semsearch-ocr bin/semsearch-ocr
          rm -rf prebuilt
          # without prebuilt programs it stops and says to install the Command Line Tools
          ! PATH="$nocl:$PATH" SEMSEARCH_APP="$RUNNER_TEMP/SemSearch.app" SEMSEARCH_SKIP_AGENT=1 ./install.sh
      - name: Run tests (tiny fake embedding model, no download)
        env:
          SEMSEARCH_DEVICE: cpu   # hosted runners report MPS but cannot allocate on it
        run: |
          .venv/bin/pip install -q -r requirements-dev.txt
          .venv/bin/python -m pytest -q tests
      - name: Uninstall (test mode)
        run: |
          SEMSEARCH_APP="$RUNNER_TEMP/SemSearch.app" SEMSEARCH_SKIP_AGENT=1 ./uninstall.sh
          test ! -e "$RUNNER_TEMP/SemSearch.app"

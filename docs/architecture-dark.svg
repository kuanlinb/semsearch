<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="SemSearch architecture: indexing and search both run on your Mac; an optional reranker can run on a GPU machine" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker></defs>
<rect x="40" y="40" width="1120" height="438" rx="16" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="64" y="72" font-size="14" font-weight="700" fill="#e6edf3">Runs entirely on your Mac</text>
<text x="1136" y="72" text-anchor="end" font-size="12.5" fill="#9198a1">files and queries never leave the machine</text>
<text x="80" y="112" font-size="12" font-weight="700" letter-spacing="1" fill="#9198a1">INDEXING · IN THE BACKGROUND</text>
<text x="80" y="336" font-size="12" font-weight="700" letter-spacing="1" fill="#9198a1">SEARCH · ON EVERY KEYSTROKE</text>
<rect x="80" y="128" width="230" height="74" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="195.0" y="161.0" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Your folders</text><text x="195.0" y="181.0" text-anchor="middle" font-size="12.5" fill="#9198a1">new files picked up in ~30 s</text>
<rect x="350" y="128" width="230" height="74" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="465.0" y="161.0" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Extract text</text><text x="465.0" y="181.0" text-anchor="middle" font-size="12.5" fill="#9198a1">PDF · Office · OCR for images</text>
<rect x="620" y="128" width="230" height="74" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="735.0" y="161.0" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Chunk + embed</text><text x="735.0" y="181.0" text-anchor="middle" font-size="12.5" fill="#9198a1">bge-m3 on the Apple GPU</text>
<rect x="890" y="128" width="230" height="74" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="1005.0" y="161.0" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">SQLite index</text><text x="1005.0" y="181.0" text-anchor="middle" font-size="12.5" fill="#9198a1">vectors · names · FTS5</text>
<path d="M310,165.0 L346,165.0" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M580,165.0 L616,165.0" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M850,165.0 L886,165.0" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="80" y="352" width="230" height="74" rx="10" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.5"/><text x="195.0" y="385.0" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">⌥Space panel</text><text x="195.0" y="405.0" text-anchor="middle" font-size="12.5" fill="#9198a1">Swift menu-bar app</text>
<rect x="350" y="352" width="230" height="74" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="465.0" y="385.0" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Embed the query</text><text x="465.0" y="405.0" text-anchor="middle" font-size="12.5" fill="#9198a1">same bge-m3 model</text>
<rect x="620" y="352" width="230" height="74" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="735.0" y="385.0" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Hybrid retrieval</text><text x="735.0" y="405.0" text-anchor="middle" font-size="12.5" fill="#9198a1">names · content · keywords</text>
<rect x="890" y="352" width="230" height="74" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="1005.0" y="385.0" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Rank + group</text><text x="1005.0" y="405.0" text-anchor="middle" font-size="12.5" fill="#9198a1">rules · usage · same folder</text>
<path d="M310,389.0 L346,389.0" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M580,389.0 L616,389.0" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M850,389.0 L886,389.0" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M930,202 L930,242 L735.0,242 L735.0,348" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#a)"/><text x="747.0" y="236" text-anchor="start" font-size="12" fill="#9198a1">reads vectors + keywords</text>
<path d="M1005.0,426 L1005.0,462 L195.0,462 L195.0,430" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#a)"/><text x="600.0" y="454" text-anchor="middle" font-size="12" fill="#9198a1">results in ~0.1 s</text>
<rect x="890" y="520" width="230" height="74" rx="10" fill="#151b23" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="6 5"/><text x="1005.0" y="553.0" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Reranker (optional)</text><text x="1005.0" y="573.0" text-anchor="middle" font-size="12.5" fill="#9198a1">a GPU machine over SSH</text>
<path d="M1080,426 L1080,516" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="6 5" marker-start="url(#o)" marker-end="url(#o)"/><text x="1090" y="474" text-anchor="start" font-size="12" fill="#9198a1">top 40</text>
<text x="874" y="562.0" text-anchor="end" font-size="12.5" fill="#9198a1">only if you turn it on; falls back to local ranking when unreachable</text>
</svg>
